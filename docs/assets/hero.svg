<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">ProxyGAyer — Your browser connects. Your tools should too.</title>
  <desc id="desc">A dark teal banner for ProxyGAyer, with illustrated Git, npm and PowerShell cards connecting to one existing HTTP proxy.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#203b42" stroke-width="1"/></pattern>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0a1721"/><stop offset="1" stop-color="#102d30"/></linearGradient>
    <linearGradient id="mint" x2="0" y2="1"><stop stop-color="#b9f8cc"/><stop offset="1" stop-color="#63cdb6"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4 0 8" fill="none" stroke="#9be6c6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1600" height="660" rx="28" fill="url(#background)"/>
  <rect x="770" width="830" height="660" rx="28" fill="url(#grid)" opacity=".42"/>
  <circle cx="1530" cy="54" r="230" fill="#346b56" opacity=".10"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(76 58)">
      <rect width="288" height="34" rx="17" fill="#193b3c" stroke="#34645a"/>
      <circle cx="20" cy="17" r="4" fill="#b8f6ce"/>
      <text x="37" y="23" fill="#b8efcf" font-size="15" font-weight="600" letter-spacing="2">WINDOWS PROXY CONTROL</text>
    </g>
    <text x="70" y="211" fill="#f0f7ef" font-size="108" font-weight="750" letter-spacing="-5">Proxy<tspan fill="url(#mint)">GAyer</tspan></text>
    <text x="76" y="300" fill="#f0f7ef" font-size="47" font-weight="650" letter-spacing="-1">Your browser connects.</text>
    <text x="76" y="360" fill="#b8f4cf" font-size="47" font-weight="650" letter-spacing="-1">Your tools should too.</text>
    <text x="78" y="423" fill="#a1bab9" font-size="23">One small app. The right settings. A way back.</text>
    <g transform="translate(77 484)">
      <rect width="110" height="47" rx="8" fill="#b6f2cb"/>
      <text x="55" y="31" fill="#102a29" text-anchor="middle" font-size="18" font-weight="750">SET</text>
      <rect x="125" width="110" height="47" rx="8" fill="none" stroke="#638f86"/>
      <text x="180" y="31" fill="#d3eae1" text-anchor="middle" font-size="18" font-weight="650">TEST</text>
      <rect x="250" width="125" height="47" rx="8" fill="none" stroke="#638f86"/>
      <text x="312" y="31" fill="#d3eae1" text-anchor="middle" font-size="18" font-weight="650">RESET</text>
    </g>
    <text x="78" y="601" fill="#789b96" font-size="16" letter-spacing="2">NATIVE C#  /  15 SECTIONS  /  BATCH APPLY</text>

    <g transform="translate(888 102) rotate(-4 180 65)">
      <rect x="0" y="7" width="375" height="119" rx="15" fill="#061219" opacity=".6"/>
      <rect width="375" height="119" rx="15" fill="#142d33" stroke="#42665f"/>
      <circle cx="28" cy="27" r="5" fill="#ef9479"/><circle cx="46" cy="27" r="5" fill="#e4c77a"/><circle cx="64" cy="27" r="5" fill="#97d6ab"/>
      <text x="28" y="76" fill="#e8f7eb" font-size="24" font-family="Consolas, monospace">$ git fetch</text>
      <text x="28" y="102" fill="#89b6aa" font-size="14" letter-spacing="1">GIT USER SETTINGS</text>
    </g>
    <g transform="translate(933 254) rotate(1 180 65)">
      <rect x="0" y="7" width="375" height="119" rx="15" fill="#061219" opacity=".6"/>
      <rect width="375" height="119" rx="15" fill="#142d33" stroke="#42665f"/>
      <circle cx="28" cy="27" r="5" fill="#ef9479"/><circle cx="46" cy="27" r="5" fill="#e4c77a"/><circle cx="64" cy="27" r="5" fill="#97d6ab"/>
      <text x="28" y="76" fill="#e8f7eb" font-size="24" font-family="Consolas, monospace">$ npm install</text>
      <text x="28" y="102" fill="#89b6aa" font-size="14" letter-spacing="1">TOOL USER SETTINGS</text>
    </g>
    <g transform="translate(887 407) rotate(-2 180 65)">
      <rect x="0" y="7" width="375" height="119" rx="15" fill="#061219" opacity=".6"/>
      <rect width="375" height="119" rx="15" fill="#142d33" stroke="#42665f"/>
      <circle cx="28" cy="27" r="5" fill="#ef9479"/><circle cx="46" cy="27" r="5" fill="#e4c77a"/><circle cx="64" cy="27" r="5" fill="#97d6ab"/>
      <text x="28" y="76" fill="#e8f7eb" font-size="24" font-family="Consolas, monospace">PS&gt; your-next-command</text>
      <text x="28" y="102" fill="#89b6aa" font-size="14" letter-spacing="1">DEDICATED LAUNCH PROFILE</text>
    </g>
    <path d="M1270 166Q1360 166 1360 283M1315 312H1360M1270 463Q1360 463 1360 342" fill="none" stroke="#91c9b2" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M1360 312H1400" fill="none" stroke="#a6e9c6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1422" y="269" width="91" height="88" rx="18" fill="#b6f2cb"/>
    <path d="M1447 302v-9a20 20 0 0140 0v9m-44 0h48v32h-48z" fill="none" stroke="#183f36" stroke-width="3" stroke-linejoin="round"/>
    <text x="1468" y="391" fill="#b9d9c6" font-size="13" text-anchor="middle" letter-spacing="1">YOUR HTTP</text>
    <text x="1468" y="410" fill="#b9d9c6" font-size="13" text-anchor="middle" letter-spacing="1">PROXY</text>
    <text x="1525" y="601" fill="#789b96" font-size="15" text-anchor="end" letter-spacing="2">BY CRAZY</text>
  </g>
</svg>
