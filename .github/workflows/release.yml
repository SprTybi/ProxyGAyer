name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') { throw 'Invalid release version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Test and build both EXEs
        run: .\build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Preserve release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ProxyGAyer-${{ env.RELEASE_TAG }}-win-x64
          path: artifacts/releases/${{ env.RELEASE_TAG }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $PWD ("artifacts/releases/" + $env:RELEASE_TAG)
          $prefix = 'ProxyGAyer-' + $env:RELEASE_TAG
          $assets = @(
            (Join-Path $directory ($prefix + '-standalone-win-x64.exe')),
            (Join-Path $directory ($prefix + '-win-x64.exe')),
            (Join-Path $directory ($prefix + '-win-x64.zip')),
            (Join-Path $directory 'SHA256SUMS.txt')
          )
          $arguments = @('release', 'create', $env:RELEASE_TAG) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
            '--title', ("ProxyGAyer " + $env:RELEASE_TAG),
            '--notes-file', (Join-Path $directory 'RELEASE_NOTES.md')
          )
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed. See the build artifact for the prepared files.' }
